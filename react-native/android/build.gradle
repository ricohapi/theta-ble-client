buildscript {
  ext.ThetaBleClientReactNative = [
    kotlinVersion: "2.0.21",
    minSdkVersion: 26,
    compileSdkVersion: 36
  ]

  ext.getExtOrDefault = { prop ->
    if (rootProject.ext.has(prop)) {
      return rootProject.ext.get(prop)
    }

    return ThetaBleClientReactNative[prop]
  }

  repositories {
    google()
    mavenCentral()
  }

  dependencies {
    classpath "com.android.tools.build:gradle:8.7.2"
    // noinspection DifferentKotlinGradleVersion
    classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:${getExtOrDefault('kotlinVersion')}"
    classpath "com.facebook.react:react-native-gradle-plugin"
  }
}


apply plugin: "com.android.library"
apply plugin: "kotlin-android"

apply plugin: "com.facebook.react"

// Only present so this module can be built/tested standalone (./gradlew
// testDebugUnitTest from this directory, no host app). When linked into an
// app via autolinking, the app's own com.android.application plugin
// application already adds these repositories and forces the react-android/
// hermes-android versions project-wide; that fan-out never runs here since
// there's no app module in this standalone build.
repositories {
  google()
  mavenCentral()
}

android {
  namespace "com.ricoh360.thetableclientreactnative"

  compileSdkVersion getExtOrDefault("compileSdkVersion")

  defaultConfig {
    minSdkVersion getExtOrDefault("minSdkVersion")
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }

  kotlinOptions {
    jvmTarget = "17"
  }

  testOptions {
    unitTests.all {
      testLogging {
        events "passed", "skipped", "failed"
      }
    }
  }
}

dependencies {
  implementation "com.facebook.react:react-android:0.78.2"
  implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:1.7.3"
  implementation "com.ricoh360.thetableclient:theta-ble-client-android:1.4.0"

  testImplementation "junit:junit:4.13.2"
  testImplementation "org.mockito.kotlin:mockito-kotlin:5.4.0"
}
